# Production-minded defaults for the v4 synthetic dataset. Regenerate the dataset using blender/generate_dataset.py first.
seed: 42
data_dir: ./generated_dataset
output_dir: ./runs
epochs: 45
patience: 8
min_delta: 0.0005
batch_size: 16
num_workers: 0
image_size: 320
validation_fraction: 0.15
test_fraction: 0.15
pretrained: true
mixed_precision: true
backbone_learning_rate: 0.00002
head_learning_rate: 0.0003
min_learning_rate: 0.000001
weight_decay: 0.0001
label_smoothing: 0.02
resume: null
loss_weights:
  family: 1.0
  spokes: 1.2
  center: 0.6
  finish: 0.5
  regression: 1.0
