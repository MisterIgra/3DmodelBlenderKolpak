[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autokolpak-ai"
version = "2.0.0"
description = "Photo-based wheel appearance recognition with model-level data validation"
requires-python = ">=3.11,<3.13"
dependencies = [
  "torch>=2.2,<3.0",
  "torchvision>=0.17,<1.0",
  "Pillow>=10.0",
  "numpy>=1.26,<3.0",
  "PyYAML>=6.0",
  "scikit-learn>=1.4,<2.0",
  "trimesh>=4.2",
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
